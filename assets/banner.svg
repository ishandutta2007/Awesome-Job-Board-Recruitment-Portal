<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; border-radius:14px; overflow:hidden;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="pipelineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.6"/>
    </linearGradient>

    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.07"/>
    </pattern>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>

    <filter id="glowEffect">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" fill="url(#techGrid)"/>

  <!-- Dynamic Glowing Orbs -->
  <circle cx="150" cy="80" r="140" fill="url(#glowGrad1)">
    <animate attributeName="cx" values="130;180;130" dur="14s" repeatCount="indefinite" />
    <animate attributeName="cy" values="70;110;70" dur="10s" repeatCount="indefinite" />
  </circle>

  <circle cx="1050" cy="270" r="160" fill="url(#glowGrad2)">
    <animate attributeName="cx" values="1070;1020;1070" dur="16s" repeatCount="indefinite" />
    <animate attributeName="cy" values="280;230;280" dur="12s" repeatCount="indefinite" />
  </circle>

  <!-- Dynamic Circuit / Pipeline Network in Midground -->
  <g opacity="0.45">
    <path d="M 80 300 H 260 L 320 330 H 600" fill="none" stroke="url(#pipelineGrad)" stroke-width="2" stroke-dasharray="6,6">
      <animate attributeName="stroke-dashoffset" values="0;-48" dur="4s" repeatCount="indefinite" />
    </path>
    <path d="M 600 330 L 660 300 H 1120" fill="none" stroke="url(#pipelineGrad)" stroke-width="2" stroke-dasharray="6,6">
      <animate attributeName="stroke-dashoffset" values="0;-48" dur="4s" repeatCount="indefinite" />
    </path>
    <path d="M 940 60 H 1060 L 1120 100 V 220" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="4,4">
      <animate attributeName="stroke-dashoffset" values="0;32" dur="5s" repeatCount="indefinite" />
    </path>
    <circle cx="260" cy="300" r="4" fill="#38bdf8"/>
    <circle cx="660" cy="300" r="4" fill="#a855f7"/>
    <circle cx="320" cy="330" r="4" fill="#6366f1"/>
    <circle cx="1060" cy="60" r="3" fill="#38bdf8"/>
    <circle cx="1120" cy="100" r="3" fill="#ec4899"/>
  </g>

  <!-- Flowing Pulse Particles (Hiring Pipeline Simulation) -->
  <circle r="3.5" fill="#38bdf8" filter="url(#glowEffect)">
    <animateMotion path="M 80 300 H 260 L 320 330 H 600 L 660 300 H 1120" dur="8s" repeatCount="indefinite" />
  </circle>
  <circle r="3.5" fill="#a855f7" filter="url(#glowEffect)">
    <animateMotion path="M 80 300 H 260 L 320 330 H 600 L 660 300 H 1120" begin="4s" dur="8s" repeatCount="indefinite" />
  </circle>

  <!-- Dynamic Candidate Pipeline Visual Badges -->
  <g transform="translate(850, 75)" opacity="0.9">
    <rect width="280" height="42" rx="8" fill="#131c31" stroke="#223356" stroke-width="1.5"/>
    <circle cx="24" cy="21" r="7" fill="#10b981"/>
    <text x="42" y="26" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="0.5">OPEN CANDIDATES</text>
    <text x="250" y="27" fill="#38bdf8" font-size="14" font-weight="700" text-anchor="end">48,920+</text>
  </g>

  <g transform="translate(870, 130)" opacity="0.9">
    <rect width="260" height="42" rx="8" fill="#131c31" stroke="#223356" stroke-width="1.5"/>
    <circle cx="24" cy="21" r="7" fill="#6366f1"/>
    <text x="42" y="26" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="0.5">MATCH ACCURACY</text>
    <text x="235" y="27" fill="#ec4899" font-size="14" font-weight="700" text-anchor="end">99.4%</text>
  </g>

  <!-- Static High-Contrast Foreground Content -->
  <!-- Top Badge / Pill -->
  <g transform="translate(80, 52)">
    <rect width="260" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="16" cy="15" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="20" fill="#38bdf8" font-size="11.5" font-weight="700" letter-spacing="1">CURATED HIRING ARCHITECTURE</text>
  </g>

  <!-- Main Hero Title -->
  <text x="80" y="142" fill="url(#brandGrad)" font-size="44" font-weight="900" letter-spacing="-1">
    Awesome Job Board &amp; ATS
  </text>
  <text x="80" y="185" fill="#f8fafc" font-size="30" font-weight="800" letter-spacing="-0.5">
    Recruitment Portal Ecosystem
  </text>

  <!-- Subtitle / Tagline -->
  <text x="80" y="224" fill="#94a3b8" font-size="15.5" font-weight="400">
    The ultimate curated compendium of Open-Source Applicant Tracking Systems,
  </text>
  <text x="80" y="248" fill="#94a3b8" font-size="15.5" font-weight="400">
    Modern Job Board Engines, AI Resume Matchers &amp; Global SaaS Talent Platforms.
  </text>

  <!-- Feature Tags / Metric Chips -->
  <g transform="translate(80, 275)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="135" height="28" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <text x="12" y="18" fill="#e2e8f0" font-size="12" font-weight="500">⚡ Open Source ATS</text>

    <!-- Pill 2 -->
    <rect x="145" y="0" width="155" height="28" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <text x="12" y="18" transform="translate(145,0)" fill="#e2e8f0" font-size="12" font-weight="500">🤖 AI Resume Matchers</text>

    <!-- Pill 3 -->
    <rect x="310" y="0" width="155" height="28" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <text x="12" y="18" transform="translate(310,0)" fill="#e2e8f0" font-size="12" font-weight="500">🌐 Enterprise Platforms</text>

    <!-- Pill 4 -->
    <rect x="475" y="0" width="145" height="28" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <text x="12" y="18" transform="translate(475,0)" fill="#e2e8f0" font-size="12" font-weight="500">📊 Pricing &amp; Metrics</text>
  </g>
</svg>
